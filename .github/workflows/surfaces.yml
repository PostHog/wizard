name: 'Surfaces'
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Unit tests run once, in build.yml. This workflow owns the two checks that
# workflow does not: the import-boundary test and the bundle shape.
jobs:
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-version.cjs
      - run: pnpm typecheck
      - run: pnpm test:arch

  bundle:
    name: Bundle audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Production build and smoke test
        run: pnpm build
      - name: Production chunk summary matches the fixture
        run: |
          npx tsx scripts/chunk-manifest.no-jest.ts dist > chunk-manifest.prod.json
          npx tsx scripts/chunk-manifest.no-jest.ts dist --summary > chunk-summary.prod.json
          npx prettier --write chunk-summary.prod.json
          diff scripts/__fixtures__/chunk-manifest.prod.json chunk-summary.prod.json
      - name: CI build and smoke test
        run: pnpm build:ci
      - name: CI chunk summary matches the fixture
        run: |
          npx tsx scripts/chunk-manifest.no-jest.ts dist > chunk-manifest.ci.json
          npx tsx scripts/chunk-manifest.no-jest.ts dist --summary > chunk-summary.ci.json
          npx prettier --write chunk-summary.ci.json
          diff scripts/__fixtures__/chunk-manifest.ci.json chunk-summary.ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chunk-manifests-${{ github.sha }}
          path: |
            chunk-manifest.*.json
            chunk-summary.*.json
