<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
  <title>How each way to run the wizard reaches runAgent</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="630" fill="#ffffff"/>

  <!-- The ways in: the two hosts the CLI starts, and callers outside the repo -->
  <rect x="20" y="20" width="220" height="70" rx="6" fill="#eaf1ff" stroke="#2f5fd0"/>
  <text x="130" y="50" fill="#1e3a8a" font-weight="600">TUI</text>
  <text x="130" y="73" fill="#1e3a8a">runTui</text>

  <rect x="260" y="20" width="220" height="70" rx="6" fill="#f1ecfb" stroke="#6c46c8"/>
  <text x="370" y="50" fill="#3b2a7a" font-weight="600">Headless</text>
  <text x="370" y="73" fill="#3b2a7a">runHeadless</text>

  <rect x="500" y="20" width="220" height="70" rx="6" fill="#f0f0ec" stroke="#7a7a72" stroke-dasharray="6 4"/>
  <text x="610" y="50" fill="#374151" font-weight="600">Workbench and</text>
  <text x="610" y="73" fill="#374151" font-weight="600">other integrations</text>

  <rect x="740" y="20" width="200" height="70" rx="6" fill="#f0f0ec" stroke="#7a7a72" stroke-dasharray="6 4"/>
  <text x="840" y="50" fill="#374151" font-weight="600">Detection and</text>
  <text x="840" y="73" fill="#374151" font-weight="600">standalone callers</text>

  <!-- The TUI's display stores, on top of its session store -->
  <rect x="20" y="150" width="220" height="80" rx="6" fill="#eaf1ff" stroke="#2f5fd0" stroke-dasharray="6 4"/>
  <text x="130" y="185" fill="#1e3a8a" font-weight="600">WizardStore</text>
  <text x="130" y="208" fill="#1e3a8a">screens, gates, display</text>

  <!-- The shared session store: one per host -->
  <rect x="20" y="280" width="700" height="80" rx="6" fill="#e8f6ec" stroke="#1f8a45" stroke-dasharray="6 4"/>
  <text x="370" y="315" fill="#14532d" font-weight="600">SessionStore</text>
  <text x="370" y="338" fill="#14532d">session and run state, one per host</text>

  <!-- runProgram -->
  <rect x="20" y="410" width="700" height="80" rx="6" fill="#e8f6ec" stroke="#1f8a45"/>
  <text x="370" y="445" fill="#14532d" font-weight="600">runProgram</text>
  <text x="370" y="468" fill="#14532d">detection, login, the host's steps, each agent run</text>

  <!-- runAgent -->
  <rect x="20" y="540" width="920" height="70" rx="6" fill="#fff1e2" stroke="#c86a12"/>
  <text x="480" y="581" fill="#78350f" font-weight="600">runAgent</text>

  <!-- Arrows: vertical only -->
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="90" x2="130" y2="148"/>
    <line x1="130" y1="230" x2="130" y2="278"/>
    <line x1="370" y1="90" x2="370" y2="278"/>
    <line x1="610" y1="90" x2="610" y2="278"/>
    <line x1="130" y1="360" x2="130" y2="408"/>
    <line x1="370" y1="360" x2="370" y2="408"/>
    <line x1="610" y1="360" x2="610" y2="408"/>
    <line x1="370" y1="490" x2="370" y2="538"/>
    <line x1="840" y1="90" x2="840" y2="538"/>
  </g>
</svg>
